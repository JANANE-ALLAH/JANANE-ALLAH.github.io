# ── Site Identity ─────────────────────────────────────────────────────────────
title             : "Mohamed JANANE ALLAH, PhD"
title_separator   : " · "
subtitle          : "Enseignant-Chercheur · Modélisation Mécanique des Structures & IA"
name              : "Mohamed JANANE ALLAH"
description       : >-
  Enseignant-chercheur à la FSTM (Université Hassan II). PhD en Génie Mécanique
  (ENSAM Casablanca). Expert en modélisation et simulation numérique des
  structures composites FGM, méthodes des éléments finis, optimisation
  structurale et intelligence artificielle appliquée à la mécanique.
url               : "https://janane-allah.github.io"
baseurl           : ""
repository        : "JANANE-ALLAH/JANANE-ALLAH.github.io"
teaser            : "/images/site-teaser.jpg"
logo              : "/images/logo.png"
masthead_title    : "Mohamed JANANE ALLAH"
breadcrumbs       : false
words_per_minute  : 200

# ── Author ────────────────────────────────────────────────────────────────────
author:
  name        : "Mohamed JANANE ALLAH"
  avatar      : "/images/profile.jpg"
  bio         : >-
    PhD · Enseignant-Chercheur, FSTM — Université Hassan II.
    Modélisation numérique · FGM · MEF · IA en mécanique.
  location    : "Casablanca, Maroc 🇲🇦"
  employer    : "FSTM · Université Hassan II"
  pubmed      : ""
  googlescholar : "https://scholar.google.com/citations?user=lNF8AUoAAAAJ&hl=fr"
  email       : "mohamedjanane147@gmail.com"
  researchgate: "M-Allah"
  uri         : "https://janane-allah.github.io"
  orcid       : "https://orcid.org/0000-0001-5852-9212"
  github      : "JANANE-ALLAH"
  linkedin    : "mohamed-janane-allah"
  medium      : "mohamedjanane147"
  twitter     : ""
  stackoverflow : ""

# ── Site Settings ─────────────────────────────────────────────────────────────
locale            : "fr-MA"
lang              : "fr"
timezone          : "Africa/Casablanca"

# ── Build ─────────────────────────────────────────────────────────────────────
markdown          : kramdown
highlighter       : rouge
lsi               : false
safe              : false
incremental       : false

kramdown:
  input           : GFM
  hard_wrap       : false
  auto_ids        : true
  entity_output   : as_char
  toc_levels      : 1..6
  smart_quotes    : lsquo,rsquo,ldquo,rdquo
  enable_coderay  : false

# ── Theme ─────────────────────────────────────────────────────────────────────
remote_theme      : "academicpages/academicpages.github.io"

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-redirect-from
  - jemoji

# ── SEO / Social ──────────────────────────────────────────────────────────────
og_image          : "/images/profile.jpg"

social:
  type  : "Person"
  name  : "Mohamed JANANE ALLAH"
  links :
    - "https://github.com/JANANE-ALLAH"
    - "https://www.linkedin.com/in/mohamed-janane-allah"
    - "https://www.researchgate.net/profile/M-Allah"
    - "https://orcid.org/0000-0001-5852-9212"
    - "https://scholar.google.com/citations?user=lNF8AUoAAAAJ&hl=fr"
    - "https://medium.com/@mohamedjanane147"

# ── Analytics ─────────────────────────────────────────────────────────────────
analytics:
  provider : false   # "google-gtag" + tracking_id si désiré

# ── Reading ───────────────────────────────────────────────────────────────────
future        : true
show_drafts   : false
paginate      : 5
paginate_path : "/blog/page:num/"

# ── Collections ───────────────────────────────────────────────────────────────
collections:
  teaching:
    output      : true
    permalink   : /:collection/:path/
  publications:
    output      : true
    permalink   : /:collection/:path/
  portfolio:
    output      : true
    permalink   : /:collection/:path/
  talks:
    output      : true
    permalink   : /:collection/:path/

# ── Defaults ──────────────────────────────────────────────────────────────────
defaults:
  - scope:
      path        : ""
      type        : posts
    values:
      layout      : single
      author_profile : true
      read_time   : true
      comments    : false
      share       : false
      related     : true

  - scope:
      path        : ""
      type        : pages
    values:
      layout      : single
      author_profile : true

  - scope:
      path        : ""
      type        : teaching
    values:
      layout      : single
      author_profile : true
      share       : false
      comments    : false

  - scope:
      path        : ""
      type        : publications
    values:
      layout      : single
      author_profile : true
      share       : false
      comments    : false

  - scope:
      path        : ""
      type        : portfolio
    values:
      layout      : single
      author_profile : true
      share       : false
      comment     : false

  - scope:
      path        : ""
      type        : talks
    values:
      layout      : talk
      author_profile : true
      share       : false

# ── Exclude ───────────────────────────────────────────────────────────────────
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - Rakefile
  - README
  - tmp
  - v2
